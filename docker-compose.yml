services:
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      PORT: 5001
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-globetrotter-dev-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-Globetrotter-data}
      ITINERARY_SERVICE_URL: http://itinerary-service:5002
      DESTINATION_SERVICE_URL: http://destination-service:5003
    ports:
      - "5001:5001"

  destination-service:
    build:
      context: .
      dockerfile: destination-service/Dockerfile
    environment:
      PORT: 5003
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-globetrotter-dev-secret}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-Globetrotter-data}
    ports:
      - "5003:5003"

  itinerary-service:
    build:
      context: .
      dockerfile: itinerary-service/Dockerfile
    environment:
      PORT: 5002
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-globetrotter-dev-secret}
      DESTINATION_SERVICE_URL: http://destination-service:5003
    ports:
      - "5002:5002"
    depends_on:
      - destination-service

  recommendation-service:
    build:
      context: .
      dockerfile: recommendation-service/Dockerfile
    environment:
      PORT: 5004
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-globetrotter-dev-secret}
      USER_SERVICE_URL: http://user-service:5001
      DESTINATION_SERVICE_URL: http://destination-service:5003
    ports:
      - "5004:5004"
    depends_on:
      - user-service
      - destination-service

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      PORT: 5000
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-kribi-tour-dev-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-globetrotter-dev-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      USER_SERVICE_URL: http://user-service:5001
      ITINERARY_SERVICE_URL: http://itinerary-service:5002
      DESTINATION_SERVICE_URL: http://destination-service:5003
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:5004
    ports:
      - "5000:5000"
    depends_on:
      - user-service
      - itinerary-service
      - destination-service
      - recommendation-service
