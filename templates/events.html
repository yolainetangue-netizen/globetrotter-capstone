<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Événements à Kribi - Kribi Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  {% include '_navbar.html' %}

  <section class="text-white py-5" style="background: linear-gradient(135deg, rgba(30,20,50,.55) 0%, rgba(40,20,10,.55) 100%), url('{{ url_for('static', filename='images/hero-evenements.jpg') }}') center/cover no-repeat;">
    <div class="container py-3">
      <a href="/kribi-page" class="text-white-50 text-decoration-none small">&larr; Toutes les catégories</a>
      <h1 class="display-6 fw-bold mt-2 mb-2">🎉 Événements à Kribi</h1>
      <p class="mb-0" style="opacity:.9;">Festivals, concerts, compétitions sportives et animations locales.</p>
    </div>
  </section>

  <main class="container my-4">
    <div class="form-check form-switch mb-4">
      <input class="form-check-input" type="checkbox" id="upcoming-only" checked />
      <label class="form-check-label" for="upcoming-only">Afficher uniquement les événements à venir</label>
    </div>

    <div id="events-list" class="row row-cols-1 row-cols-md-2 g-4">
      <p class="hint">Chargement des événements...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const listEl = document.getElementById("events-list");
    const upcomingToggle = document.getElementById("upcoming-only");

    const EVENT_TYPE_ICON = {
      "Festival": "🎪",
      "Concert": "🎵",
      "Compétition sportive": "🏆",
      "Animation locale": "🎈",
    };

    function formatDateRange(e) {
      const opts = { day: "numeric", month: "long", year: "numeric" };
      const start = new Date(e.date + "T00:00:00").toLocaleDateString("fr-FR", opts);
      if (e.end_date && e.end_date !== e.date) {
        const end = new Date(e.end_date + "T00:00:00").toLocaleDateString("fr-FR", opts);
        return `Du ${start} au ${end}`;
      }
      return start;
    }

    function isPast(e) {
      const today = new Date().toISOString().slice(0, 10);
      return (e.end_date || e.date) < today;
    }

    // Genere un fichier .ics standard (compatible Google Calendar, Outlook,
    // Apple Calendar) pour un evenement donne, sans dependance serveur : le
    // fichier est construit et telecharge entierement cote client.
    function downloadEventIcs(e) {
      const toIcsDate = (dateStr) => dateStr.replace(/-/g, "");
      const startDate = toIcsDate(e.date);
      // DTEND exclusif en .ics : on ajoute un jour a la date de fin (ou de
      // debut si pas de fin) pour couvrir la derniere journee de l'evenement.
      const endBase = e.end_date || e.date;
      const endDateObj = new Date(endBase + "T00:00:00");
      endDateObj.setDate(endDateObj.getDate() + 1);
      const endDate = toIcsDate(endDateObj.toISOString().slice(0, 10));

      const escapeIcs = (text) => (text || "").replace(/[,;]/g, "\\$&").replace(/\n/g, "\\n");

      const ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Kribi Tour//Evenements//FR",
        "BEGIN:VEVENT",
        `UID:event-${e.id}@kribi-tour`,
        `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").split(".")[0]}Z`,
        `DTSTART;VALUE=DATE:${startDate}`,
        `DTEND;VALUE=DATE:${endDate}`,
        `SUMMARY:${escapeIcs(e.name)}`,
        `LOCATION:${escapeIcs(e.location || "Kribi")}`,
        `DESCRIPTION:${escapeIcs(e.description || "")}`,
        "END:VEVENT",
        "END:VCALENDAR",
      ].join("\r\n");

      const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `${e.name.replace(/[^\w\s-]/g, "")}.ics`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function eventCardHTML(e) {
      const icon = EVENT_TYPE_ICON[e.type] || "📅";
      const past = isPast(e);
      let media;
      if (e.local_image) {
        media = `<img src="${e.local_image}" alt="${e.name}" class="w-100 h-100" style="object-fit:cover;" />`;
      } else {
        const query = (e.image_query || `${e.name} Kribi Cameroun`).replace(/"/g, "");
        media = `<div class="placeholder-media photo-slot cat-nightlife" data-photo-query="${query}"><span>${icon}</span></div>`;
      }

      return `
        <div class="col">
          <div class="card h-100 shadow-sm border-0 card-hover ${past ? "opacity-75" : ""}">
            <div class="gt-media">${media}</div>
            <div class="card-body">
              <div class="d-flex flex-wrap gap-2 mb-2">
                <span class="badge badge-cat-nightlife">${icon} ${e.type || "Événement"}</span>
                ${past ? '<span class="badge bg-secondary">Terminé</span>' : '<span class="badge bg-success">À venir</span>'}
              </div>
              <h3 class="h6 mb-1">${e.name}</h3>
              <p class="small text-muted mb-1">📅 ${formatDateRange(e)}</p>
              <p class="small text-muted mb-2">📍 ${e.location || "Kribi"}</p>
              <p class="small mb-2">${e.description || ""}</p>
              ${e.price ? `<p class="small mb-2"><strong>💰</strong> ${e.price}</p>` : ""}
              ${e.contact ? `<p class="small mb-2"><strong>📞</strong> ${e.contact}</p>` : ""}
              ${!past ? `<button type="button" class="btn btn-sm btn-outline-primary rounded-pill add-to-calendar-btn" data-event-id="${e.id}">🔔 Me le rappeler</button>` : ""}
            </div>
          </div>
        </div>
      `;
    }

    // Garde les evenements en memoire pour retrouver leurs donnees completes
    // au clic sur "Me le rappeler" sans refaire d'appel reseau.
    let loadedEvents = [];

    async function loadEvents() {
      const params = upcomingToggle.checked ? "?upcoming=true" : "";
      try {
        const res = await fetch(`/events${params}`);
        const data = await res.json();
        if (data.length === 0) {
          listEl.innerHTML = `<p class="hint">${upcomingToggle.checked ? "Aucun événement à venir pour le moment." : "Aucun événement enregistré."}</p>`;
          return;
        }
        listEl.innerHTML = data.map(eventCardHTML).join("");
        hydratePhotos(listEl);
        loadedEvents = data;

        listEl.querySelectorAll(".add-to-calendar-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const event = loadedEvents.find((e) => e.id === parseInt(btn.dataset.eventId, 10));
            if (event) downloadEventIcs(event);
          });
        });
      } catch {
        listEl.innerHTML = "<p class='hint'>Impossible de charger les événements.</p>";
      }
    }

    upcomingToggle.addEventListener("change", loadEvents);
    loadEvents();
  </script>
</body>
</html>
