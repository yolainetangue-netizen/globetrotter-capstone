<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Itinéraire partagé - Kribi Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Kribi Tour" style="height:30px;" />
        Kribi Tour
      </a>
    </div>
  </nav>

  <main class="container my-4" style="max-width: 720px;">
    <p class="hint mb-3">📤 Itinéraire partagé avec vous</p>
    <div id="content">
      <p class="hint">Chargement...</p>
    </div>
    <div class="text-center mt-4">
      <a href="/" class="btn btn-outline-primary rounded-pill">Découvrir Kribi Tour &rarr;</a>
    </div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const TOKEN = {{ token | tojson }};
    const content = document.getElementById("content");

    function destinationMediaHTML(destination) {
      if (!destination) return "";
      const query = (destination.image_query || `${destination.name} Kribi Cameroun`).replace(/"/g, "");
      const fallbackQuery = (destination.image_query_fallback || "").replace(/"/g, "");
      return destination.local_image
        ? `<img src="${destination.local_image}" alt="${destination.name}" class="w-100" style="max-height:280px;object-fit:cover;border-radius:12px;" />`
        : `<div class="placeholder-media photo-slot" style="height:220px;border-radius:12px;" data-photo-query="${query}" data-photo-fallback="${fallbackQuery}"><span>📍</span></div>`;
    }

    async function loadSharedItinerary() {
      const { ok, data } = await apiRequest(`/itineraries/public/${TOKEN}`);

      if (!ok) {
        content.innerHTML = `<div class="alert alert-warning mb-0">Ce lien de partage est invalide ou a expiré.</div>`;
        return;
      }

      const dest = data.destination;

      content.innerHTML = `
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h1 class="h3 mb-3">${data.title || "Itinéraire"}</h1>
            ${destinationMediaHTML(dest)}
            <div class="mt-3">
              <h2 class="h5 mb-1">${dest ? dest.name : "Destination"}</h2>
              <p class="text-muted mb-2">${dest ? (dest.description || "") : ""}</p>
              <p class="mb-1"><strong>Départ :</strong> ${data.start_date || "Non précisé"}</p>
              <p class="mb-1"><strong>Retour :</strong> ${data.end_date || "Non précisé"}</p>
              ${data.notes ? `<p class="mb-0 mt-2"><strong>Notes :</strong> ${data.notes}</p>` : ""}
              ${dest ? `<a href="/destination/${dest.id}" class="btn btn-sm btn-gt-teal rounded-pill mt-3">Voir la fiche du lieu &rarr;</a>` : ""}
            </div>
          </div>
        </div>
      `;
      hydratePhotos(content);
    }

    loadSharedItinerary();
  </script>
</body>
</html>
