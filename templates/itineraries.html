<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes itinéraires - Kribi Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  {% include '_navbar.html' %}

  <main class="container my-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="h4 mb-4">Mes itinéraires</h2>
        <div id="content"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const content = document.getElementById("content");

    async function loadItineraries() {
      if (!isLoggedIn()) {
        content.innerHTML = `<div class="alert alert-warning mb-0">Vous devez être <a href="/login-page">connecté</a> pour voir vos itinéraires.</div>`;
        return;
      }

      const { ok, data } = await apiRequest("/itineraries", { auth: true });

      if (!ok) {
        content.innerHTML = `<p class="hint">Impossible de charger les itinéraires.</p>`;
        return;
      }

      if (data.length === 0) {
        content.innerHTML = `<p class="hint">Aucun itinéraire pour le moment. Rendez-vous sur <a href="/destinations-page">Destinations</a> pour en créer un.</p>`;
        return;
      }

      // On recupere le nom de chaque destination pour un affichage plus lisible
      const destResults = await Promise.all(
        data.map((it) => apiRequest(`/destinations/${it.destination_id}`))
      );
      const destNames = {};
      destResults.forEach((r, i) => {
        destNames[data[i].destination_id] = r.ok ? r.data.name : `#${data[i].destination_id}`;
      });

      const rows = data
        .map(
          (it) => `
        <tr>
          <td class="fw-semibold">${it.title}</td>
          <td><a href="/destination/${it.destination_id}" class="text-decoration-none">${destNames[it.destination_id]}</a></td>
          <td>${it.start_date || "—"}</td>
          <td>${it.end_date || "—"}</td>
          <td class="text-muted small">${it.notes || "—"}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary download-pdf-btn" data-id="${it.id}" data-title="${(it.title || "itineraire").replace(/"/g, "")}">
              📥 PDF
            </button>
            <button class="btn btn-sm btn-outline-secondary share-btn" data-id="${it.id}">
              🔗 Partager
            </button>
          </td>
        </tr>`
        )
        .join("");

      content.innerHTML = `
        <p class="hint mb-3">💡 Télécharge un itinéraire en PDF pour le consulter même sans connexion internet.</p>
        <div id="share-link-box" class="alert alert-info d-none mb-3"></div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr><th>Titre</th><th>Destination</th><th>Début</th><th>Fin</th><th>Notes</th><th>Actions</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;

      document.querySelectorAll(".download-pdf-btn").forEach((btn) => {
        btn.addEventListener("click", () => downloadItineraryPdf(btn.dataset.id, btn, btn.dataset.title));
      });

      document.querySelectorAll(".share-btn").forEach((btn) => {
        btn.addEventListener("click", () => shareItinerary(btn.dataset.id, btn));
      });
    }

    // Genere (ou recupere) un lien de partage public et l'affiche avec un
    // bouton "Copier", pour un envoi facile par SMS/WhatsApp/etc.
    async function shareItinerary(id, btn) {
      const originalLabel = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = "⏳ ...";
      try {
        const { ok, data } = await apiRequest(`/itineraries/${id}/share`, { method: "POST", auth: true });
        if (!ok) throw new Error("Échec de la génération du lien");

        const link = `${window.location.origin}/itinerary/shared/${data.share_token}`;
        const box = document.getElementById("share-link-box");
        box.classList.remove("d-none");
        box.innerHTML = `
          <p class="mb-2">🔗 Voici le lien à envoyer :</p>
          <div class="input-group">
            <input type="text" class="form-control" value="${link}" id="share-link-input" readonly />
            <button class="btn btn-outline-primary" id="copy-share-link-btn">Copier le lien</button>
          </div>
        `;
        document.getElementById("copy-share-link-btn").addEventListener("click", () => {
          const input = document.getElementById("share-link-input");
          input.select();
          navigator.clipboard.writeText(input.value).then(() => {
            const copyBtn = document.getElementById("copy-share-link-btn");
            copyBtn.textContent = "Copié ✓";
            setTimeout(() => { copyBtn.textContent = "Copier le lien"; }, 2000);
          });
        });
        box.scrollIntoView({ behavior: "smooth", block: "center" });
      } catch (err) {
        alert("Impossible de générer le lien de partage. Réessaie dans un instant.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalLabel;
      }
    }

    // Le PDF est protege par JWT (comme le reste de l'API), donc un simple
    // lien <a href> ne suffit pas : on recupere le fichier via fetch() avec
    // l'en-tete Authorization, puis on declenche le telechargement nous-memes.
    async function downloadItineraryPdf(id, btn, title) {
      const originalLabel = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = "⏳ ...";
      try {
        const res = await fetch(`/itineraries/${id}/download`, {
          headers: { Authorization: `Bearer ${getToken()}` },
        });
        if (!res.ok) throw new Error("Échec du téléchargement");
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${title || "itineraire"}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
      } catch (err) {
        alert("Impossible de télécharger le PDF. Réessaie dans un instant.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalLabel;
      }
    }

    loadItineraries();
  </script>
</body>
</html>
