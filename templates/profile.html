<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon profil - Kribi Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  {% include '_navbar.html' %}

  <section class="text-white py-5" style="background: linear-gradient(135deg, rgba(30,20,50,.55) 0%, rgba(40,20,10,.55) 100%), url('{{ url_for('static', filename='images/hero-profil.webp') }}') center/cover no-repeat;">
    <div class="container py-3">
      <h1 class="display-6 fw-bold mb-2">👤 Mon profil</h1>
      <p class="mb-0" style="opacity:.9;">Votre compte, vos préférences et vos itinéraires</p>
    </div>
  </section>

  <main class="container my-4">
    <div id="profile-content">
      <p class="hint">Chargement de votre profil...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const contentEl = document.getElementById("profile-content");

    const PREFERENCE_LABELS = {
      culture: "Culture",
      history: "Histoire",
      nature: "Nature",
      adventure: "Aventure",
      shopping: "Shopping",
      relaxation: "Détente",
      city: "Vie urbaine",
      beach: "Plage",
    };

    const AUTH_PROVIDER_LABELS = {
      password: "Compte classique (nom d'utilisateur / mot de passe)",
      google: "Connecté via Google",
    };

    function renderProfile(user, itineraries, activity) {
      const initials = (user.username || "?").slice(0, 2).toUpperCase();

      const prefsHTML = user.preferences && user.preferences.length
        ? user.preferences.map((p) => `<span class="badge bg-gt-orange border-0 me-1 mb-1">${PREFERENCE_LABELS[p] || p}</span>`).join("")
        : `<span class="hint">Aucune préférence renseignée pour le moment.</span>`;

      const roleBadge = user.role === "admin"
        ? `<span class="badge bg-dark ms-2">Administrateur</span>`
        : "";

      const itinerariesHTML = itineraries.length
        ? `
          <ul class="list-group list-group-flush">
            ${itineraries.map((it) => `
              <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                <div>
                  <div class="fw-semibold">${it.title}</div>
                  <div class="small text-muted">${it.start_date || "?"} → ${it.end_date || "?"}</div>
                </div>
                <a href="/itineraries-page" class="btn btn-sm btn-outline-secondary rounded-pill">Voir</a>
              </li>
            `).join("")}
          </ul>
        `
        : `
          <p class="hint mb-2">Vous n'avez pas encore créé d'itinéraire.</p>
          <a href="/destinations-page" class="btn btn-gt-teal rounded-pill px-4">Découvrir des destinations</a>
        `;

      contentEl.innerHTML = `
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body p-4 d-flex flex-column flex-sm-row align-items-center gap-4">
            <div id="avatar-wrap" class="position-relative flex-shrink-0" style="width:96px;height:96px;cursor:pointer;">
              ${user.avatar_url
                ? `<img id="avatar-img" src="${user.avatar_url}" alt="Photo de profil" class="rounded-circle w-100 h-100" style="object-fit:cover;" />`
                : `<div id="avatar-initials" class="d-flex align-items-center justify-content-center rounded-circle bg-gt-orange text-white fw-bold w-100 h-100" style="font-size:1.9rem;">${initials}</div>`
              }
              <div class="position-absolute bottom-0 end-0 bg-white rounded-circle shadow-sm d-flex align-items-center justify-content-center" style="width:30px;height:30px;font-size:0.9rem;">📷</div>
            </div>
            <input type="file" id="avatar-input" accept="image/jpeg,image/png,image/webp" hidden />
            <div class="text-center text-sm-start">
              <div id="avatar-msg" class="small mb-1"></div>
              <h1 class="h4 mb-1">${user.username}${roleBadge}</h1>
              <p class="small text-muted mb-0">${AUTH_PROVIDER_LABELS[user.auth_provider] || "Compte classique"}</p>
              ${user.email ? `<p class="small text-muted mb-0">${user.email}</p>` : ""}
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <div class="row g-3 text-center">
              <div class="col-4 col-md-2">
                <a href="/favorites-page" class="text-decoration-none text-reset">
                  <div class="h4 mb-0">${favoritesCount()}</div>
                  <div class="small text-muted">❤️ Lieux favoris</div>
                </a>
              </div>
              <div class="col-4 col-md-2">
                <div class="h4 mb-0" id="fav-categories-count">…</div>
                <div class="small text-muted">📂 Catégories</div>
              </div>
              <div class="col-4 col-md-2">
                <div class="h4 mb-0">${itineraries.length}</div>
                <div class="small text-muted">📅 Itinéraires</div>
              </div>
              <div class="col-6 col-md-3">
                <div class="h4 mb-0">${activity ? activity.reservations_count : "—"}</div>
                <div class="small text-muted">🗓️ Réservations</div>
              </div>
              <div class="col-6 col-md-3">
                <div class="h4 mb-0">${activity ? activity.pdf_downloads_count : "—"}</div>
                <div class="small text-muted">📄 PDF téléchargés</div>
              </div>
            </div>
          </div>
        </div>

        <h2 class="h5 mb-3">🏅 Badges</h2>
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <div class="row g-3 text-center" id="badges-row"></div>
          </div>
        </div>

        <h2 class="h5 mb-3">Mes voyages</h2>
        <div class="card border-0 shadow-sm mb-2">
          <div class="card-body p-4">
            <h3 class="h6 mb-3">Centres d'intérêt</h3>
            <div class="mb-4">${prefsHTML}</div>

            <h3 class="h6 mb-3">📅 Mes itinéraires (${itineraries.length})</h3>
            ${itinerariesHTML}
          </div>
        </div>

        ${activity && activity.pdf_downloads.length ? `
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h3 class="h6 mb-3">Téléchargements récents</h3>
            <ul class="list-group list-group-flush">
              ${activity.pdf_downloads.map((d) => `
                <li class="list-group-item d-flex justify-content-between align-items-center px-0 small">
                  <span>${d.itinerary_title}</span>
                  <span class="text-muted">${new Date(d.downloaded_at).toLocaleDateString("fr-FR")}</span>
                </li>
              `).join("")}
            </ul>
          </div>
        </div>
        ` : ""}

        <h2 class="h5 mb-3">Paramètres</h2>
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center py-2">
              <span>Langue</span>
              <button id="lang-toggle-btn-profile" type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                <span id="lang-toggle-label-profile">EN</span>
              </button>
            </div>
          </div>
        </div>
      `;

      bindAvatarUpload();
      loadFavoriteCategoriesCount();
      renderBadges(itineraries.length);
    }

    // Badges simples, calcules a partir d'actions verifiables : favoris
    // (stockes localement) et itineraires crees (verifies cote serveur).
    // Volontairement pas de badge sur les avis, qui ne sont pas rattaches
    // de facon fiable a un compte pour l'instant.
    const BADGE_DEFINITIONS = [
      { icon: "❤️", label: "Premier coup de cœur", check: (favCount) => favCount >= 1 },
      { icon: "💖", label: "Collectionneur de lieux", check: (favCount) => favCount >= 5 },
      { icon: "🗺️", label: "Explorateur passionné", check: (favCount) => favCount >= 10 },
      { icon: "📅", label: "Premier itinéraire", check: (favCount, itinCount) => itinCount >= 1 },
      { icon: "🧳", label: "Voyageur organisé", check: (favCount, itinCount) => itinCount >= 3 },
    ];

    function renderBadges(itinerariesCount) {
      const row = document.getElementById("badges-row");
      if (!row) return;

      const favCount = favoritesCount();
      row.innerHTML = BADGE_DEFINITIONS.map((badge) => {
        const unlocked = badge.check(favCount, itinerariesCount);
        return `
          <div class="col-4 col-md-2">
            <div class="p-2 rounded-3 ${unlocked ? "" : "opacity-25"}" title="${badge.label}">
              <div style="font-size:1.8rem;">${badge.icon}</div>
              <div class="small ${unlocked ? "fw-semibold" : "text-muted"}">${badge.label}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function loadFavoriteCategoriesCount() {
      const el = document.getElementById("fav-categories-count");
      if (!el) return;

      const favIds = getFavorites();
      if (!favIds.length) {
        el.textContent = "0";
        return;
      }

      // Recupere toutes les destinations pour croiser avec les IDs favoris
      // et compter les categories distinctes representees.
      const { ok, data } = await apiRequest("/destinations");
      if (!ok) {
        el.textContent = "—";
        return;
      }

      const favIdsStr = favIds.map(String);
      const categories = new Set(
        data
          .filter((d) => favIdsStr.includes(String(d.id)))
          .map((d) => d.category)
      );
      el.textContent = categories.size;
    }

    function bindAvatarUpload() {
      const wrap = document.getElementById("avatar-wrap");
      const input = document.getElementById("avatar-input");
      const msgEl = document.getElementById("avatar-msg");
      if (!wrap || !input) return;

      wrap.addEventListener("click", () => input.click());

      input.addEventListener("change", async () => {
        const file = input.files[0];
        if (!file) return;

        msgEl.innerHTML = `<span class="text-muted">Envoi en cours...</span>`;

        const formData = new FormData();
        formData.append("avatar", file);

        try {
          const res = await fetch("/me/avatar", {
            method: "POST",
            headers: { Authorization: `Bearer ${getToken()}` },
            body: formData,
          });
          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            msgEl.innerHTML = `<span class="text-danger">${data.error || "Échec de l'envoi de la photo."}</span>`;
            return;
          }

          // Met a jour l'affichage immediatement, sans recharger toute la page
          wrap.querySelectorAll("#avatar-img, #avatar-initials").forEach((el) => el.remove());
          const img = document.createElement("img");
          img.id = "avatar-img";
          img.src = data.avatar_url;
          img.alt = "Photo de profil";
          img.className = "rounded-circle w-100 h-100";
          img.style.objectFit = "cover";
          wrap.insertBefore(img, wrap.firstChild);

          msgEl.innerHTML = `<span class="text-success">Photo mise à jour ✓</span>`;
          setTimeout(() => { msgEl.innerHTML = ""; }, 3000);
        } catch (err) {
          msgEl.innerHTML = `<span class="text-danger">Échec de l'envoi, réessayez.</span>`;
        }
      });
    }

    async function loadProfile() {
      if (!isLoggedIn()) {
        window.location.href = "/login-page";
        return;
      }

      const [meResult, itinerariesResult, activityResult] = await Promise.all([
        apiRequest("/me", { auth: true }),
        apiRequest("/itineraries", { auth: true }),
        apiRequest("/me/activity", { auth: true }),
      ]);

      if (meResult.status === 401) {
        window.location.href = "/login-page";
        return;
      }

      if (!meResult.ok) {
        contentEl.innerHTML = `<div class="alert alert-danger">Impossible de charger votre profil pour le moment.</div>`;
        return;
      }

      const itineraries = itinerariesResult.ok ? itinerariesResult.data : [];
      const activity = activityResult.ok ? activityResult.data : null;
      renderProfile(meResult.data, itineraries, activity);
    }

    loadProfile();
  </script>
</body>
</html>
