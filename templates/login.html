<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion / Inscription - Kribi Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  {% include '_navbar.html' %}

  <section class="auth-hero d-flex align-items-center py-5" style="background: linear-gradient(rgba(15,20,25,0.55), rgba(15,20,25,0.55)), url('{{ url_for('static', filename='images/login-bg-new.jpg') }}') center/cover no-repeat;">
    <div class="container">
      <div class="row justify-content-center align-items-center g-5">
        <div class="col-11 col-sm-8 col-md-6 col-lg-5">
          <div class="gt-glass-card p-4 p-md-5">
            <div class="text-center mb-3">
              <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Kribi Tour" style="height:72px;" />
              <p class="mt-2 mb-0" style="font-family: 'Playfair Display', serif; font-style: italic;">Envie de découvrir Kribi ?</p>
            </div>

            <!-- Bascule Connexion / Inscription -->
            <div class="btn-group w-100 mb-4" role="group">
              <button type="button" id="tab-login" class="btn btn-gt-orange fw-semibold">Se connecter</button>
              <button type="button" id="tab-register" class="btn btn-outline-secondary fw-semibold">Créer un compte</button>
            </div>

            <!-- ===================== FORMULAIRE CONNEXION ===================== -->
            <div id="panel-login">
              <h2 class="h4 mb-3" style="font-family: 'Playfair Display', serif; font-style: italic;">Bon retour !</h2>

              <form id="login-form">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Nom d'utilisateur</label>
                  <div class="gt-input-wrap">
                    <span class="gt-input-icon">👤</span>
                    <input type="text" id="login-username" class="gt-input" placeholder="Votre nom d'utilisateur" required />
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Mot de passe</label>
                  <div class="gt-input-wrap">
                    <span class="gt-input-icon">🔒</span>
                    <input type="password" id="login-password" class="gt-input" placeholder="Votre mot de passe" required />
                    <button type="button" id="toggle-password" class="gt-input-action" aria-label="Afficher le mot de passe">👁️</button>
                  </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="form-check">
                    <input type="checkbox" id="remember-me" class="form-check-input" checked />
                    <label for="remember-me" class="form-check-label small">Se souvenir de moi</label>
                  </div>
                  <a href="#" id="forgot-password" class="small">Mot de passe oublié ?</a>
                </div>

                <button type="submit" id="login-submit-btn" class="btn btn-gt-orange w-100 py-2 rounded-pill fw-semibold d-flex align-items-center justify-content-center gap-2">
                  <span class="btn-label">Se connecter →</span>
                  <span class="spinner-border spinner-border-sm btn-spinner" hidden></span>
                </button>
              </form>
              <div id="login-msg" class="mt-3"></div>
              <div id="forgot-msg" class="mt-3" style="display:none;"></div>

              <div class="d-flex align-items-center gap-2 my-3">
                <hr class="flex-grow-1" />
                <span class="text-muted small">ou</span>
                <hr class="flex-grow-1" />
              </div>

              <!-- Connexion avec Google -->
              <div id="google-signin-login" class="d-flex justify-content-center mb-2"></div>
              <div id="google-msg-login" class="mb-2"></div>
            </div>

            <!-- ===================== FORMULAIRE INSCRIPTION ===================== -->
            <div id="panel-register" style="display:none;">
              <h2 class="h4 mb-3" style="font-family: 'Playfair Display', serif; font-style: italic;">Créer un compte</h2>

              <form id="register-form">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Nom d'utilisateur</label>
                  <div class="gt-input-wrap">
                    <span class="gt-input-icon">👤</span>
                    <input type="text" id="register-username" class="gt-input" placeholder="Choisissez un nom d'utilisateur" required />
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Mot de passe</label>
                  <div class="gt-input-wrap">
                    <span class="gt-input-icon">🔒</span>
                    <input type="password" id="register-password" class="gt-input" placeholder="Choisissez un mot de passe" required />
                  </div>
                </div>

                <p class="fw-semibold small mb-1 mt-4">Qu'est-ce qui vous intéresse ?</p>
                <p class="hint mb-2">Vos choix alimentent vos recommandations personnalisées</p>
                <div class="d-flex flex-wrap gap-2 mb-4" id="pref-pills">
                  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="culture">Culture</button>
                  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="history">Histoire</button>
                  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="nature">Nature</button>
                  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="adventure">Aventure</button>
                  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="shopping">Shopping</button>
                  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="relaxation">Détente</button>
                  <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="city">Vie urbaine</button>
                </div>

                <button type="submit" class="btn btn-gt-orange w-100 py-2 rounded-pill fw-semibold">Créer mon compte →</button>
              </form>
              <div id="register-msg" class="mt-3"></div>

              <div class="d-flex align-items-center gap-2 my-3">
                <hr class="flex-grow-1" />
                <span class="text-muted small">ou</span>
                <hr class="flex-grow-1" />
              </div>

              <!-- Inscription avec Google -->
              <div id="google-signin-register" class="d-flex justify-content-center mb-2"></div>
              <div id="google-msg-register" class="mb-2"></div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    // ---------------------------------------------------------------------
    // Bascule entre les trois panneaux (Connexion / Inscription / Par email)
    // ---------------------------------------------------------------------
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const panelLogin = document.getElementById("panel-login");
    const panelRegister = document.getElementById("panel-register");

    const TABS = {
      login: { tab: tabLogin, panel: panelLogin, path: "/login-page" },
      register: { tab: tabRegister, panel: panelRegister, path: "/register-page" },
    };

    function showPanel(which) {
      Object.entries(TABS).forEach(([key, { tab, panel }]) => {
        const active = key === which;
        panel.style.display = active ? "block" : "none";
        tab.classList.toggle("btn-gt-orange", active);
        tab.classList.toggle("btn-outline-secondary", !active);
      });
      history.replaceState(null, "", TABS[which].path);
    }

    tabLogin.addEventListener("click", () => showPanel("login"));
    tabRegister.addEventListener("click", () => showPanel("register"));

    // Ouvre directement le bon panneau selon la page d'origine
    if (window.location.pathname === "/register-page") showPanel("register");

    // ---------------------------------------------------------------------
    // Connexion
    // ---------------------------------------------------------------------
    const loginForm = document.getElementById("login-form");
    const loginMsg = document.getElementById("login-msg");
    const submitBtn = document.getElementById("login-submit-btn");
    const btnLabel = submitBtn.querySelector(".btn-label");
    const btnSpinner = submitBtn.querySelector(".btn-spinner");

    const passwordInput = document.getElementById("login-password");
    const togglePassword = document.getElementById("toggle-password");
    togglePassword.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      togglePassword.textContent = isHidden ? "🙈" : "👁️";
      togglePassword.setAttribute("aria-label", isHidden ? "Masquer le mot de passe" : "Afficher le mot de passe");
    });

    const forgotLink = document.getElementById("forgot-password");
    const forgotMsg = document.getElementById("forgot-msg");
    forgotLink.addEventListener("click", (e) => {
      e.preventDefault();
      forgotMsg.style.display = "block";
      forgotMsg.innerHTML = `<div class="alert alert-warning py-2 small mb-0">La réinitialisation par e-mail n'est pas encore disponible sur cette version. Contactez l'administrateur du site pour réinitialiser votre mot de passe.</div>`;
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value.trim();
      const remember = document.getElementById("remember-me").checked;

      submitBtn.disabled = true;
      btnLabel.hidden = true;
      btnSpinner.hidden = false;

      const { ok, data } = await apiRequest("/login", {
        method: "POST",
        body: { username, password },
      });

      if (ok) {
        setToken(data.access_token, remember);
        loginMsg.innerHTML = `<div class="alert alert-success py-2 small mb-0">Bienvenue, ${data.user.username} !</div>`;
        setTimeout(() => (window.location.href = "/destinations-page"), 800);
      } else {
        loginMsg.innerHTML = `<div class="alert alert-danger py-2 small mb-0">${data.error || "Connexion echouee."}</div>`;
        submitBtn.disabled = false;
        btnLabel.hidden = false;
        btnSpinner.hidden = true;
      }
    });

    // ---------------------------------------------------------------------
    // Inscription
    // ---------------------------------------------------------------------
    const registerForm = document.getElementById("register-form");
    const registerMsg = document.getElementById("register-msg");
    const pills = document.querySelectorAll("#pref-pills .pref-pill");
    const selected = new Set();

    pills.forEach((pill) => {
      pill.addEventListener("click", () => {
        const val = pill.dataset.value;
        if (selected.has(val)) {
          selected.delete(val);
          pill.classList.remove("btn-gt-orange", "border-0");
          pill.classList.add("btn-outline-secondary");
        } else {
          selected.add(val);
          pill.classList.remove("btn-outline-secondary");
          pill.classList.add("btn-gt-orange", "border-0");
        }
      });
    });

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("register-username").value.trim();
      const password = document.getElementById("register-password").value.trim();
      const preferences = Array.from(selected);

      const { ok, data } = await apiRequest("/register", {
        method: "POST",
        body: { username, password, preferences },
      });

      if (ok) {
        registerMsg.innerHTML = `<div class="alert alert-success py-2 small mb-0">Compte créé ! Vous pouvez maintenant vous connecter.</div>`;
        registerForm.reset();
        pills.forEach((p) => {
          p.classList.remove("btn-gt-orange", "border-0");
          p.classList.add("btn-outline-secondary");
        });
        selected.clear();
        setTimeout(() => showPanel("login"), 1200);
      } else {
        registerMsg.innerHTML = `<div class="alert alert-danger py-2 small mb-0">${data.error || "Inscription echouee."}</div>`;
      }
    });

    // ---------------------------------------------------------------------
    // Connexion / inscription avec Google
    // ---------------------------------------------------------------------
    const GOOGLE_CLIENT_ID = "{{ google_client_id }}";

    async function handleGoogleCredential(response) {
      const { ok, data } = await apiRequest("/auth/google", {
        method: "POST",
        body: { credential: response.credential },
      });

      const msgLogin = document.getElementById("google-msg-login");
      const msgRegister = document.getElementById("google-msg-register");

      if (ok) {
        setToken(data.access_token, true);
        const msg = `<div class="alert alert-success py-2 small mb-0">Bienvenue, ${data.user.username} !</div>`;
        msgLogin.innerHTML = msg;
        msgRegister.innerHTML = msg;
        setTimeout(() => (window.location.href = "/destinations-page"), 800);
      } else {
        const msg = `<div class="alert alert-danger py-2 small mb-0">${data.error || "Connexion Google echouee."}</div>`;
        msgLogin.innerHTML = msg;
        msgRegister.innerHTML = msg;
      }
    }

    if (GOOGLE_CLIENT_ID) {
      window.onload = () => {
        if (typeof google === "undefined") return;
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleGoogleCredential,
        });
        google.accounts.id.renderButton(
          document.getElementById("google-signin-login"),
          { theme: "outline", size: "large", text: "signin_with", shape: "pill", width: 280 }
        );
        google.accounts.id.renderButton(
          document.getElementById("google-signin-register"),
          { theme: "outline", size: "large", text: "signup_with", shape: "pill", width: 280 }
        );
      };
    }
  </script>
</body>
</html>
