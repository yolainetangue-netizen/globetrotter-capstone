<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes réservations - Kribi Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  {% include '_navbar.html' %}

  <main class="container my-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="h4 mb-4">📅 Mes réservations</h2>
        <div id="content"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const content = document.getElementById("content");

    const STATUS_LABELS = {
      pending: { label: "En attente", cls: "bg-warning text-dark" },
      confirmed: { label: "Confirmée", cls: "bg-success" },
      cancelled: { label: "Annulée", cls: "bg-secondary" },
    };

    function statusBadge(status) {
      const info = STATUS_LABELS[status] || { label: status || "—", cls: "bg-secondary" };
      return `<span class="badge ${info.cls}">${info.label}</span>`;
    }

    async function loadReservations() {
      if (!isLoggedIn()) {
        content.innerHTML = `<div class="alert alert-warning mb-0">Vous devez être <a href="/login-page">connecté</a> pour voir vos réservations.</div>`;
        return;
      }

      const { ok, status, data } = await apiRequest("/reservations", { auth: true });

      if (status === 401) {
        content.innerHTML = `<div class="alert alert-warning mb-0">Votre session a expiré. <a href="/login-page">Reconnectez-vous</a> pour voir vos réservations.</div>`;
        return;
      }

      if (!ok) {
        content.innerHTML = `<p class="hint">Impossible de charger les réservations pour le moment.</p>`;
        return;
      }

      if (data.length === 0) {
        content.innerHTML = `
          <p class="hint mb-3">Vous n'avez pas encore de réservation.</p>
          <a href="/destinations-page" class="btn btn-gt-teal rounded-pill px-4">Découvrir les hôtels et restaurants</a>
        `;
        return;
      }

      const rows = data
        .map(
          (r) => `
        <tr>
          <td class="fw-semibold"><a href="/destination/${r.destination_id}" class="text-decoration-none">${r.destination_name}</a></td>
          <td>${r.guest_name}</td>
          <td>${r.date}</td>
          <td>${r.time}</td>
          <td>${r.party_size}</td>
          <td>${statusBadge(r.status)}</td>
        </tr>`
        )
        .join("");

      content.innerHTML = `
        <p class="hint mb-3">💡 L'établissement vous contactera pour confirmer chaque réservation.</p>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr><th>Lieu</th><th>Nom</th><th>Date</th><th>Heure</th><th>Pers.</th><th>Statut</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    loadReservations();
  </script>
</body>
</html>
