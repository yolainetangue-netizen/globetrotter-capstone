<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — Kribi Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  {% include '_navbar.html' %}

  <main class="container my-4">
    <div class="card shadow-sm border-0 chat-panel" id="chat-panel">
      <div class="card-body p-3 p-md-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <div>
            <h1 class="h3 mb-1">💬 Discussion</h1>
            <p class="text-muted mb-0">Échangez avec la communauté ou envoyez un message privé.</p>
          </div>
          <span id="chat-connection-label" class="badge text-bg-secondary">Connexion…</span>
        </div>

        <div class="locked-state" id="chat-locked-state">
          <div class="alert alert-info mb-0">
            Connectez-vous depuis <a href="/login-page">la page de connexion</a> pour accéder au chat.
          </div>
        </div>

        <div class="chat-shell hidden" id="chat-shell">
          <aside class="chat-sidebar">
            <button type="button" class="chat-tab-btn active" id="chat-tab-community">🌍 Communauté</button>
            <div class="chat-sidebar-label">Messages privés</div>
            <div id="chat-thread-list"></div>

            <hr />
            <label class="chat-sidebar-label" for="chat-people-search">Nouveau message</label>
            <input type="text" id="chat-people-search" class="form-control form-control-sm" placeholder="Rechercher un utilisateur…" />
            <div id="chat-people-results"></div>
          </aside>

          <section class="chat-main">
            <h3 id="chat-header-title">🌍 Communauté</h3>
            <div id="chat-presence" class="chat-presence"></div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-row">
              <input type="text" id="chat-input" class="form-control" maxlength="2000" placeholder="Écrivez votre message…" autocomplete="off" />
              <button type="button" id="chat-send-btn" class="btn btn-primary small">Envoyer</button>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script>window.GT_CHAT_SOCKET_URL = {{ chat_socket_url|tojson }};</script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
