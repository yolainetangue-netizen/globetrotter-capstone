<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription - Kribi Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  {% include '_navbar.html' %}

  <section class="auth-hero d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-11 col-sm-9 col-md-7 col-lg-5">
          <div class="gt-glass-card p-4 p-md-5">
            <p class="text-uppercase small fw-semibold mb-1" style="color: var(--violet); letter-spacing: 2px;">Kribi Tour</p>
            <p class="text-muted small mb-4">Explorez Kribi. Voyagez mieux.</p>

            <h2 class="h4 mb-1">Créer un compte</h2>
            <p class="text-muted small mb-4">Rejoignez la communauté des explorateurs</p>

            <form id="register-form">
              <div class="mb-3">
                <div class="input-group">
                  <span class="input-group-text">👤</span>
                  <input type="text" id="username" class="form-control" placeholder="Nom d'utilisateur" required />
                </div>
              </div>
              <div class="mb-3">
                <div class="input-group">
                  <span class="input-group-text">🔒</span>
                  <input type="password" id="password" class="form-control" placeholder="Mot de passe" required />
                </div>
              </div>

              <p class="fw-semibold small mb-1 mt-4">Qu'est-ce qui vous intéresse ?</p>
              <p class="hint mb-2">Vos choix alimentent vos recommandations personnalisées</p>
              <div class="d-flex flex-wrap gap-2 mb-4" id="pref-pills">
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="culture">Culture</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="history">Histoire</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="nature">Nature</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="adventure">Aventure</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="shopping">Shopping</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="relaxation">Détente</button>
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill pref-pill" data-value="city">Vie urbaine</button>
              </div>

              <button type="submit" class="btn btn-gt-orange w-100 py-2 rounded-pill fw-semibold">Créer mon compte →</button>
            </form>
            <div id="msg" class="mt-3"></div>

            <div class="text-center text-muted small my-3">ou</div>

            <a href="/login-page" class="btn btn-outline-secondary w-100 rounded-pill">J'ai déjà un compte</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const form = document.getElementById("register-form");
    const msg = document.getElementById("msg");
    const pills = document.querySelectorAll(".pref-pill");
    const selected = new Set();

    pills.forEach((pill) => {
      pill.addEventListener("click", () => {
        const val = pill.dataset.value;
        if (selected.has(val)) {
          selected.delete(val);
          pill.classList.remove("btn-gt-orange", "border-0");
          pill.classList.add("btn-outline-secondary");
        } else {
          selected.add(val);
          pill.classList.remove("btn-outline-secondary");
          pill.classList.add("btn-gt-orange", "border-0");
        }
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const preferences = Array.from(selected);

      const { ok, data } = await apiRequest("/register", {
        method: "POST",
        body: { username, password, preferences },
      });

      if (ok) {
        msg.innerHTML = `<div class="alert alert-success py-2 small mb-0">Compte créé ! Vous pouvez vous connecter.</div>`;
        form.reset();
        pills.forEach((p) => {
          p.classList.remove("btn-gt-orange", "border-0");
          p.classList.add("btn-outline-secondary");
        });
        selected.clear();
      } else {
        msg.innerHTML = `<div class="alert alert-danger py-2 small mb-0">${data.error || "Inscription echouee."}</div>`;
      }
    });
  </script>
</body>
</html>
