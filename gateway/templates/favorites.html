<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes favoris - Kribi Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  {% include '_navbar.html' %}

  <section class="text-white py-5" style="background: linear-gradient(135deg, rgba(30,20,50,.55) 0%, rgba(40,20,10,.55) 100%), url('{{ url_for('static', filename='images/hero-favoris.jpg') }}') center/cover no-repeat;">
    <div class="container py-3">
      <h1 class="display-6 fw-bold mb-2">♥ Mes favoris</h1>
      <p class="mb-0" style="opacity:.9;">Enregistrés directement sur cet appareil — pas besoin de compte.</p>
    </div>
  </section>

  <main class="container my-4">
    <div id="favorites-list" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
      <p class="hint">Chargement de vos favoris...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const listEl = document.getElementById("favorites-list");

    function destinationCardHTML(d) {
      const m = categoryMeta(d.category);
      let media;
      if (d.local_image) {
        media = `<img src="${d.local_image}" alt="${d.name}" loading="lazy" />`;
      } else {
        const query = (d.image_query || `${d.name} ${d.city} Cameroun`).replace(/"/g, "");
        const fallbackQuery = (d.image_query_fallback || "").replace(/"/g, "");
        media = `<div class="placeholder-media photo-slot ${m.cls}" data-photo-query="${query}" data-photo-fallback="${fallbackQuery}"><span>${m.icon}</span></div>`;
      }

      return `
        <div class="col" data-fav-card="${d.id}">
          <div class="card h-100 shadow-sm border-0 card-hover position-relative">
            <button class="btn-favorite active" data-fav-id="${d.id}" aria-label="Retirer des favoris"
              onclick="event.preventDefault(); toggleFavorite(${d.id}); document.querySelector('[data-fav-card=\\'${d.id}\\']').remove(); if(!getFavorites().length) location.reload();">♥</button>
            <a href="/destination/${d.id}" class="text-decoration-none text-reset">
              <div class="gt-media">${media}</div>
              <div class="card-body">
                <span class="badge ${m.badge} mb-2">${m.icon} ${d.category || ""}</span>
                <h3 class="h6 mb-1">${d.name}</h3>
                <p class="small mb-0">${d.description}</p>
              </div>
            </a>
          </div>
        </div>
      `;
    }

    async function loadFavorites() {
      const ids = getFavorites();
      if (ids.length === 0) {
        listEl.innerHTML = `
          <div class="col-12">
            <p class="hint">Vous n'avez encore aucun favori. Cliquez sur ♥ sur une destination pour l'ajouter ici.</p>
            <a href="/kribi-page" class="btn btn-gt-teal rounded-pill px-4 mt-2">Découvrir Kribi</a>
          </div>
        `;
        return;
      }

      const results = await Promise.all(ids.map((id) => apiRequest(`/destinations/${id}`)));
      const valid = results.filter((r) => r.ok).map((r) => r.data);

      if (valid.length === 0) {
        listEl.innerHTML = "<p class='hint'>Impossible de charger vos favoris.</p>";
        return;
      }

      listEl.innerHTML = valid.map(destinationCardHTML).join("");
      hydratePhotos(listEl);
    }

    loadFavorites();
  </script>
</body>
</html>
