<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discussion - Kribi Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    #chat-messages {
      height: 55vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 0.5rem;
    }
    .chat-bubble {
      max-width: 75%;
      padding: 0.5rem 0.85rem;
      border-radius: 14px;
      background: #f1f3f5;
    }
    .chat-bubble.own {
      align-self: flex-end;
      background: var(--turquoise, #0ea5c4);
      color: #fff;
    }
    .chat-bubble .chat-author {
      font-size: 0.75rem;
      font-weight: 700;
      opacity: 0.75;
      margin-bottom: 0.15rem;
    }
    .chat-bubble .chat-time {
      font-size: 0.68rem;
      opacity: 0.6;
      margin-top: 0.2rem;
    }
  </style>
</head>
<body>
  {% include '_navbar.html' %}

  <main class="container my-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="h4 mb-1">💬 Discussion générale</h2>
        <p class="hint mb-3">Un salon commun ouvert à tous les utilisateurs connectés de Kribi Tour.</p>

        <div id="chat-guard"></div>

        <div id="chat-panel" style="display:none;">
          <div id="chat-messages" class="border rounded-3 bg-white mb-3"></div>
          <form id="chat-form" class="d-flex gap-2">
            <input type="text" id="chat-input" class="form-control" placeholder="Écrire un message..." maxlength="2000" autocomplete="off" />
            <button type="submit" class="btn btn-gt-teal rounded-pill px-4">Envoyer</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const guard = document.getElementById("chat-guard");
    const panel = document.getElementById("chat-panel");
    const messagesEl = document.getElementById("chat-messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("chat-input");

    let currentUsername = null;

    function formatTime(isoString) {
      const d = new Date(isoString);
      return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    }

    function appendMessage(msg) {
      const isOwn = msg.username === currentUsername;
      const bubble = document.createElement("div");
      bubble.className = `chat-bubble ${isOwn ? "own" : ""}`;
      bubble.innerHTML = `
        ${isOwn ? "" : `<div class="chat-author">${msg.username}</div>`}
        <div class="chat-text"></div>
        <div class="chat-time">${formatTime(msg.created_at)}</div>
      `;
      bubble.querySelector(".chat-text").textContent = msg.text; // textContent = pas d'injection HTML
      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function initChat() {
      const chatBadge = document.getElementById("chat-badge");
      if (chatBadge) chatBadge.style.display = "none";

      if (!isLoggedIn()) {
        guard.innerHTML = `<div class="alert alert-warning mb-0">Vous devez être <a href="/login-page">connecté</a> pour accéder à la discussion.</div>`;
        return;
      }

      const me = await apiRequest("/me", { auth: true });
      if (!me.ok) {
        guard.innerHTML = `<div class="alert alert-warning mb-0">Votre session a expiré, merci de vous <a href="/login-page">reconnecter</a>.</div>`;
        return;
      }
      currentUsername = me.data.username;

      // Charge l'historique avant de se connecter en temps reel, pour ne
      // pas rater les tout premiers messages qui arriveraient entre-temps.
      const history = await apiRequest("/messages/public", { auth: true });
      if (history.ok) {
        history.data.forEach(appendMessage);
      }

      panel.style.display = "block";

      const socket = io({ auth: { token: getToken() } });

      socket.on("new_public_message", (msg) => {
        appendMessage(msg);
      });

      socket.on("connect_error", () => {
        guard.innerHTML = `<div class="alert alert-danger mb-0">Connexion au salon impossible pour le moment. Réessayez dans un instant.</div>`;
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        socket.emit("send_public_message", { text });
        input.value = "";
      });
    }

    initChat();
  </script>
</body>
</html>
