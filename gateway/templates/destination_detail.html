<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail du lieu - Kribi Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  {% include '_navbar.html' %}

  <main class="container my-4">
    <a href="/destinations-page" class="d-inline-block mb-3 text-decoration-none">&larr; Retour aux destinations</a>

    <div id="detail-content">
      <p class="hint">Chargement...</p>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    const DESTINATION_ID = {{ destination_id }};
    const RESERVABLE_CATEGORIES = ["Hôtels", "Restaurants"];
    const container = document.getElementById("detail-content");

    recordRecentlyViewed(DESTINATION_ID);

    function updateFavButton() {
      const btn = document.getElementById("fav-btn");
      const icon = document.getElementById("fav-icon");
      const label = document.getElementById("fav-label");
      if (!btn) return;
      const fav = isFavorite(DESTINATION_ID);
      icon.textContent = fav ? "♥" : "♡";
      label.textContent = fav ? "Dans vos favoris" : "Ajouter aux favoris";
      btn.classList.toggle("btn-danger", fav);
      btn.classList.toggle("btn-outline-danger", !fav);
      btn.classList.toggle("text-white", fav);
    }

    function handleDetailFavorite() {
      toggleFavorite(DESTINATION_ID);
      updateFavButton();
    }

    // ---------------------------------------------------------------------
    // Météo (Open-Meteo, via /api/weather) — WEATHER_CODES/weatherInfo/fetchWeatherData
    // sont définis dans script.js et partagés entre les pages.
    // ---------------------------------------------------------------------
    const DAY_LABELS = ["Aujourd'hui", "Demain", "Après-demain", "Dans 3 jours"];

    async function loadWeather(lat, lng) {
      const card = document.getElementById("weather-card");
      const content = document.getElementById("weather-content");
      const data = await fetchWeatherData(lat, lng);
      if (!data) return;

      const cur = data.current_weather;
      const curInfo = weatherInfo(cur.weathercode);
      const month = new Date().getMonth() + 1;
      const isDrySeason = month <= 3 || month >= 11;
      const seasonNote = isDrySeason
        ? "Nous sommes en grande saison sèche : les tarifs \"saison sèche\" affichés plus bas sont les plus pertinents en ce moment."
        : "Nous sommes en saison des pluies : les tarifs \"saison des pluies\" affichés plus bas sont les plus pertinents en ce moment.";

      const daily = data.daily;
      let forecastHTML = "";
      if (daily && daily.time) {
        forecastHTML = `
          <div class="row row-cols-3 g-2 mb-3">
            ${daily.time.map((date, i) => {
              if (i === 0) return "";
              const info = weatherInfo(daily.weathercode[i]);
              return `
                <div class="col">
                  <div class="weather-day">
                    <p class="small text-muted mb-1">${DAY_LABELS[i] || date}</p>
                    <p class="mb-1 fs-5">${info.icon}</p>
                    <p class="small fw-semibold mb-0">${Math.round(daily.temperature_2m_max[i])}° / ${Math.round(daily.temperature_2m_min[i])}°</p>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      content.innerHTML = `
        <div class="d-flex align-items-center gap-3 mb-3">
          <span class="weather-current-icon">${curInfo.icon}</span>
          <div>
            <p class="weather-current-temp mb-0">${Math.round(cur.temperature)}°C</p>
            <p class="small text-muted mb-0">${curInfo.label}</p>
          </div>
        </div>
        ${forecastHTML}
        <p class="hint mb-1">🔎 ${seasonNote}</p>
        <p class="hint mb-0" style="font-size:0.72rem;">Données fournies par Open-Meteo, mises à jour régulièrement.</p>
      `;
      card.style.display = "block";
    }

    function renderDetail(d) {
      const meta = categoryMeta(d.category);
      let media;
      if (d.local_image) {
        media = `<img src="${d.local_image}" alt="${d.name}" class="w-100 h-100" style="object-fit:cover;" />`;
      } else {
        const query = (d.image_query || `${d.name} ${d.city} Cameroun`).replace(/"/g, "");
        const fallbackQuery = (d.image_query_fallback || "").replace(/"/g, "");
        media = `<div class="placeholder-media photo-slot ${meta.cls}" data-photo-query="${query}" data-photo-fallback="${fallbackQuery}"><span>${meta.icon}</span></div>`;
      }

      const activities = (d.activities || [])
        .map((a) => `<li class="mb-1">${a}</li>`)
        .join("");

      const practical = d.practical_info
        ? `
          <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
              <h2 class="h5 mb-3">Informations pratiques</h2>
              <div class="table-responsive">
                <table class="table table-borderless mb-0 small">
                  ${d.practical_info.hours ? `<tr><td class="fw-semibold" style="width:35%">Horaires</td><td>${d.practical_info.hours}</td></tr>` : ""}
                  ${d.practical_info.price ? `<tr><td class="fw-semibold">Tarif indicatif</td><td>${d.practical_info.price}</td></tr>` : ""}
                  ${d.practical_info.best_time ? `<tr><td class="fw-semibold">Meilleure période</td><td>${d.practical_info.best_time}</td></tr>` : ""}
                  ${d.practical_info.access ? `<tr><td class="fw-semibold">Accès</td><td>${d.practical_info.access}</td></tr>` : ""}
                </table>
              </div>
            </div>
          </div>
        `
        : "";

      const budgetBlock = d.budget
        ? `
          <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
              <h2 class="h5 mb-3">💰 Budget indicatif</h2>
              <p class="mb-2">${d.budget}</p>
              <p class="hint mb-0">Les prix sont indicatifs, à confirmer sur place ; ils varient selon la négociation et l'affluence.</p>
            </div>
          </div>
        `
        : "";

      const transportBlock = d.transport
        ? `
          <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
              <h2 class="h5 mb-3">🚖 Transport</h2>
              <div class="table-responsive">
                <table class="table table-borderless mb-0 small">
                  ${typeof d.transport === "object"
                    ? `
                      ${d.transport.walk ? `<tr><td class="fw-semibold" style="width:35%">🚶 À pied</td><td>${d.transport.walk}</td></tr>` : ""}
                      <tr><td class="fw-semibold" style="width:35%">🏍️ Moto</td><td>${d.transport.moto || "—"}</td></tr>
                      <tr><td class="fw-semibold">🚗 Voiture <span class="hint">(longues distances)</span></td><td>${d.transport.taxi || "—"}</td></tr>
                      ${d.transport.note ? `<tr><td class="fw-semibold">ℹ️ Bon à savoir</td><td>${d.transport.note}</td></tr>` : ""}
                    `
                    : `<tr><td class="fw-semibold">Comment y aller</td><td>${d.transport}</td></tr>`
                }
              </table>
              </div>
            </div>
          </div>
        `
        : "";

      container.innerHTML = `
        <div class="gt-media gt-media-full mb-4" style="min-height:320px; max-height:520px; border-radius:0.75rem;">${media}</div>

        <div class="mb-4">
          <div class="d-flex flex-wrap gap-2 mb-2">
            <span class="badge ${meta.badge}">${meta.icon} ${d.category || ""}</span>
            <span class="badge bg-light text-dark border">📍 ${d.city || ""}</span>
          </div>
          <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
            <div>
              <h1 class="h3 mb-1">${d.name}</h1>
              <p class="text-muted mb-0">${d.country}</p>
              ${d.practical_info && d.practical_info.access ? `<p class="text-muted small mb-0">📍 ${d.practical_info.access}</p>` : ""}
            </div>
            <div class="d-flex flex-wrap gap-2">
              <button id="fav-btn" class="btn btn-outline-danger rounded-pill btn-sm" onclick="handleDetailFavorite()">
                <span id="fav-icon">♡</span> <span id="fav-label">Ajouter aux favoris</span>
              </button>
              <a href="/destinations-page?add_to_itinerary=${d.id}" class="btn btn-gt-teal rounded-pill btn-sm">📅 Voir l'itinéraire</a>
              <a href="/reservations-page" class="btn btn-outline-secondary rounded-pill btn-sm">🗓️ Planifié</a>
            </div>
          </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h5 mb-0">À propos</h2>
              <button type="button" id="listen-btn" class="btn btn-sm btn-outline-secondary rounded-pill">
                🔊 Écouter
              </button>
            </div>
            <p>${(d.long_description || d.description || "").replace(/\n\n/g, "</p><p>")}</p>
            ${d.video ? `
              <video controls preload="metadata" class="w-100 rounded-3 mt-3" style="max-height:420px; background:#000;">
                <source src="${d.video}" type="video/mp4" />
                Votre navigateur ne supporte pas la lecture vidéo.
              </video>
            ` : ""}
          </div>
        </div>

        ${d.menu && d.menu.length
          ? `
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body p-4">
            <h2 class="h5 mb-3">🍽️ Menu</h2>
            <ul class="list-group list-group-flush">
              ${d.menu.map(item => `
                <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                  <span>${item.plat}</span>
                  <span class="fw-semibold text-nowrap ms-3">${item.prix}</span>
                </li>
              `).join("")}
            </ul>
            <p class="hint mb-0 mt-3">Menu indicatif, susceptible d'évoluer selon disponibilité et saison.</p>
          </div>
        </div>
          `
          : ""
        }

        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body p-4">
            <h2 class="h5 mb-3">📞 Contact &amp; réservation</h2>
            ${d.contact
              ? `
                <p class="mb-3">${d.contact}</p>
                <div class="d-flex flex-wrap gap-2">
                  <a href="tel:${d.contact.replace(/[^\d+]/g, "")}" class="btn btn-gt-orange rounded-pill btn-sm">Appeler pour réserver</a>
                  ${RESERVABLE_CATEGORIES.includes(d.category) ? `<button type="button" id="open-reservation-btn" class="btn btn-outline-secondary rounded-pill btn-sm">📅 Réserver en ligne</button>` : ""}
                </div>
              `
              : RESERVABLE_CATEGORIES.includes(d.category)
                ? `
                  <p class="hint mb-3">Aucun contact renseigné pour ce lieu pour le moment.</p>
                  <button type="button" id="open-reservation-btn" class="btn btn-outline-secondary rounded-pill btn-sm">📅 Réserver en ligne</button>
                `
                : `<p class="hint mb-0">Aucun contact renseigné pour ce lieu pour le moment. Rendez-vous sur place ou consultez la section transport pour vous y rendre.</p>`
            }

            ${RESERVABLE_CATEGORIES.includes(d.category) ? `
              <form id="reservation-form" class="mt-4 pt-4 border-top" style="display:none;">
                <h3 class="h6 mb-3">Réserver une table / une chambre</h3>
                <div class="row g-2">
                  <div class="col-12 col-sm-6">
                    <label class="form-label small fw-semibold">Nom</label>
                    <input type="text" id="res-guest-name" class="form-control form-control-sm" placeholder="Votre nom" required />
                  </div>
                  <div class="col-6 col-sm-3">
                    <label class="form-label small fw-semibold">Date</label>
                    <input type="date" id="res-date" class="form-control form-control-sm" required />
                  </div>
                  <div class="col-6 col-sm-3">
                    <label class="form-label small fw-semibold">Heure</label>
                    <input type="time" id="res-time" class="form-control form-control-sm" required />
                  </div>
                  <div class="col-6 col-sm-4">
                    <label class="form-label small fw-semibold">Nombre de personnes</label>
                    <input type="number" id="res-party-size" min="1" value="2" class="form-control form-control-sm" required />
                  </div>
                  <div class="col-12 col-sm-8">
                    <label class="form-label small fw-semibold">Note (facultatif)</label>
                    <input type="text" id="res-note" class="form-control form-control-sm" placeholder="Allergie, occasion particulière..." />
                  </div>
                </div>
                <button type="submit" class="btn btn-gt-orange rounded-pill btn-sm mt-3">Confirmer la réservation</button>
                <div id="reservation-msg" class="mt-2"></div>
              </form>
            ` : ""}
          </div>
        </div>

        ${activities ? `
          <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
              <h2 class="h5 mb-3">Que faire sur place</h2>
              <ul class="mb-0">${activities}</ul>
            </div>
          </div>
        ` : ""}

        ${practical}

        <div class="card shadow-sm border-0 mb-4" id="weather-card" style="display:none;">
          <div class="card-body p-4">
            <h2 class="h5 mb-3">🌤️ Météo actuelle</h2>
            <div id="weather-content"></div>
          </div>
        </div>

        ${budgetBlock}
        ${transportBlock}

        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body p-4">
            <h2 class="h5 mb-3">Localisation</h2>
            <div id="detail-map" style="height:320px; border-radius:0.5rem;"></div>
          </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body p-4">
            <div>${d.tags.map((t) => `<span class="badge bg-light text-dark border me-1">${t}</span>`).join("")}</div>
          </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body p-4">
            <h2 class="h5 mb-3">⭐ Avis des visiteurs</h2>
            <div id="reviews-summary" class="mb-3"></div>
            <div id="reviews-list" class="mb-4"></div>

            <form id="review-form" class="border-top pt-4">
              <h3 class="h6 mb-3">Laisser un avis</h3>
              <div class="row g-2 align-items-center mb-2">
                <div class="col-md-8">
                  <input type="text" id="review-author" class="form-control" placeholder="Votre nom (facultatif)" maxlength="60" />
                </div>
                <div class="col-md-4">
                  <div id="review-stars" class="review-stars-input" data-rating="0">
                    <span data-value="1">★</span><span data-value="2">★</span><span data-value="3">★</span><span data-value="4">★</span><span data-value="5">★</span>
                  </div>
                </div>
              </div>
              <textarea id="review-comment" class="form-control mb-3" rows="3" placeholder="Partagez votre expérience sur place..." maxlength="1000"></textarea>
              <div class="mb-3">
                <label for="review-photo" class="form-label small hint mb-1">Ajouter une photo (facultatif)</label>
                <input type="file" id="review-photo" class="form-control" accept="image/jpeg,image/png,image/webp" />
              </div>
              <button type="submit" class="btn btn-gt-teal rounded-pill px-4">Publier mon avis</button>
              <div id="review-message" class="mt-2"></div>
            </form>
          </div>
        </div>
      `;

      hydratePhotos(container);
      initReviews();
      updateFavButton();
      if (typeof d.lat === "number" && typeof d.lng === "number") {
        loadWeather(d.lat, d.lng);
      }

      if (typeof d.lat === "number" && typeof d.lng === "number") {
        const map = L.map('detail-map').setView([d.lat, d.lng], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
        }).addTo(map);
        L.marker([d.lat, d.lng]).addTo(map).bindPopup(d.name).openPopup();
      }
    }

    async function loadDetail() {
      const { ok, data } = await apiRequest(`/destinations/${DESTINATION_ID}`);
      if (ok) {
        renderDetail(data);
        bindReservationForm();
        bindListenButton(data);
      } else {
        container.innerHTML = "<p class='hint'>Ce lieu est introuvable.</p>";
      }
    }

    function bindListenButton(d) {
      const btn = document.getElementById("listen-btn");
      if (!btn) return;

      if (!("speechSynthesis" in window)) {
        btn.disabled = true;
        btn.title = "La lecture vocale n'est pas disponible sur cet appareil";
        return;
      }

      const textParts = [d.name];
      if (d.practical_info && d.practical_info.access) textParts.push(`Situé ${d.practical_info.access}.`);
      textParts.push(d.long_description || d.description || "");
      const textToRead = textParts.join(". ");

      let isSpeaking = false;

      btn.addEventListener("click", () => {
        if (isSpeaking) {
          window.speechSynthesis.cancel();
          isSpeaking = false;
          btn.innerHTML = "🔊 Écouter";
          return;
        }

        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = "fr-FR";
        utterance.rate = 0.95;

        utterance.onend = () => {
          isSpeaking = false;
          btn.innerHTML = "🔊 Écouter";
        };
        utterance.onerror = () => {
          isSpeaking = false;
          btn.innerHTML = "🔊 Écouter";
        };

        window.speechSynthesis.cancel(); // annule toute lecture en cours ailleurs
        window.speechSynthesis.speak(utterance);
        isSpeaking = true;
        btn.innerHTML = "⏹️ Arrêter";
      });
    }

    function bindReservationForm() {
      const openBtn = document.getElementById("open-reservation-btn");
      const form = document.getElementById("reservation-form");
      if (!openBtn || !form) return;

      openBtn.addEventListener("click", () => {
        const isHidden = form.style.display === "none";
        form.style.display = isHidden ? "block" : "none";
        if (isHidden) form.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const msgEl = document.getElementById("reservation-msg");
        const submitBtn = form.querySelector("button[type='submit']");

        const payload = {
          destination_id: DESTINATION_ID,
          guest_name: document.getElementById("res-guest-name").value.trim(),
          date: document.getElementById("res-date").value,
          time: document.getElementById("res-time").value,
          party_size: document.getElementById("res-party-size").value,
          note: document.getElementById("res-note").value.trim(),
        };

        submitBtn.disabled = true;
        const { ok, data } = await apiRequest("/reservations", {
          method: "POST",
          body: payload,
          auth: isLoggedIn(),
        });
        submitBtn.disabled = false;

        if (ok) {
          msgEl.innerHTML = `<div class="alert alert-success py-2 small mb-0">Réservation envoyée pour le ${payload.date} à ${payload.time} (${payload.party_size} pers.). L'établissement vous contactera pour confirmer.</div>`;
          form.reset();
          document.getElementById("res-party-size").value = 2;
        } else {
          msgEl.innerHTML = `<div class="alert alert-danger py-2 small mb-0">${data.error || "Impossible d'envoyer la réservation, réessayez."}</div>`;
        }
      });
    }

    function starsHTML(rating) {
      const full = Math.round(rating);
      return Array.from({ length: 5 }, (_, i) => (i < full ? "★" : "☆")).join("");
    }

    async function loadReviews() {
      const { ok, data } = await apiRequest(`/destinations/${DESTINATION_ID}/reviews`);
      const summaryEl = document.getElementById("reviews-summary");
      const listEl = document.getElementById("reviews-list");
      if (!ok) return;

      summaryEl.innerHTML = data.count > 0
        ? `<span class="review-stars-static">${starsHTML(data.average)}</span> <strong>${data.average}/5</strong> <span class="hint">(${data.count} avis)</span>`
        : `<p class="hint mb-0">Aucun avis pour le moment. Soyez le premier à partager votre expérience !</p>`;

      listEl.innerHTML = data.reviews.map((r) => `
        <div class="border-bottom pb-3 mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <strong class="small">${r.author}</strong>
            <span class="review-stars-static small">${starsHTML(r.rating)}</span>
          </div>
          <p class="small mb-1">${r.comment}</p>
          ${r.photo_url ? `<img src="${r.photo_url}" alt="Photo ajoutée par ${r.author}" class="rounded-3 mb-1" style="max-width:220px; max-height:160px; object-fit:cover;" />` : ""}
          <div><span class="hint">${new Date(r.date).toLocaleDateString("fr-FR")}</span></div>
        </div>
      `).join("");
    }

    function initReviews() {
      loadReviews();

      const starsEl = document.getElementById("review-stars");
      const stars = starsEl.querySelectorAll("span");
      stars.forEach((star) => {
        star.addEventListener("click", () => {
          starsEl.dataset.rating = star.dataset.value;
          stars.forEach((s) => s.classList.toggle("filled", s.dataset.value <= star.dataset.value));
        });
      });

      const form = document.getElementById("review-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const msgEl = document.getElementById("review-message");
        const rating = parseInt(starsEl.dataset.rating, 10);
        const author = document.getElementById("review-author").value.trim();
        const comment = document.getElementById("review-comment").value.trim();
        const photoFile = document.getElementById("review-photo").files[0];

        if (!rating) {
          msgEl.innerHTML = `<div class="alert alert-danger py-2 small mb-0">Merci de choisir une note (1 à 5 étoiles).</div>`;
          return;
        }
        if (!comment) {
          msgEl.innerHTML = `<div class="alert alert-danger py-2 small mb-0">Merci d'écrire un petit commentaire.</div>`;
          return;
        }

        // Utilise FormData (au lieu de apiRequest, qui envoie du JSON) des
        // qu'une photo est jointe, pour rester compatible avec l'upload de
        // fichier cote serveur - identique au mecanisme deja utilise pour
        // la photo de profil.
        const formData = new FormData();
        formData.append("author", author);
        formData.append("rating", rating);
        formData.append("comment", comment);
        if (photoFile) formData.append("photo", photoFile);

        const res = await fetch(`/destinations/${DESTINATION_ID}/reviews`, {
          method: "POST",
          body: formData,
        });
        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          msgEl.innerHTML = `<div class="alert alert-success py-2 small mb-0">Merci pour votre avis !</div>`;
          form.reset();
          starsEl.dataset.rating = "0";
          stars.forEach((s) => s.classList.remove("filled"));
          loadReviews();
        } else {
          msgEl.innerHTML = `<div class="alert alert-danger py-2 small mb-0">${data.error || "Une erreur est survenue."}</div>`;
        }
      });
    }

    loadDetail();
  </script>
</body>
</html>
